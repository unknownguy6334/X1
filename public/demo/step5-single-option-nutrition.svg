<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" height="100%" role="img" aria-label="Principles of Nutrition single option schedule example with clean non-overlapping course name, code, days, and timing callouts">
  <defs>
    <filter id="card-shadow-clean" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="badge-shadow-clean" x="-4%" y="-8%" width="108%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Main Portal Card with Red Outline -->
  <g filter="url(#card-shadow-clean)">
    <rect x="14" y="12" width="732" height="446" rx="14" fill="#FFFFFF" stroke="#a30818" stroke-width="2.2" />

    <!-- 1. COURSE NAME: Highlight box around text with crisp black text + Arrow + Badge -->
    <rect x="28" y="36" width="340" height="54" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" />
    <text x="44" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#000000">Principles of Nutrition</text>
    
    <!-- Arrow pointing left towards the highlight box -->
    <line x1="450" y1="63" x2="382" y2="63" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" />
    <polygon points="384,55 372,63 384,71" fill="#1D4ED8" />

    <!-- (Course Name) Large High-Contrast Pill Badge with PURE BLACK TEXT -->
    <g filter="url(#badge-shadow-clean)">
      <rect x="452" y="36" width="254" height="54" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
      <text x="579" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#000000" letter-spacing="0.5">(Course Name)</text>
    </g>

    <!-- 2. COURSE CODE: Highlight box around code + Arrow + Badge -->
    <rect x="28" y="102" width="240" height="50" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" />
    <text x="44" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#000000">NUT10102-MCM</text>
    
    <!-- Chevron on right side -->
    <path d="M 714,127 L 722,119 L 730,127" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrow pointing left towards the highlight box -->
    <line x1="450" y1="127" x2="282" y2="127" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" />
    <polygon points="284,119 272,127 284,135" fill="#1D4ED8" />

    <!-- (Course Code) Large High-Contrast Pill Badge with PURE BLACK TEXT -->
    <g filter="url(#badge-shadow-clean)">
      <rect x="452" y="102" width="254" height="50" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
      <text x="579" y="136" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#000000" letter-spacing="0.5">(Course Code)</text>
    </g>

    <!-- 3. (Days) Badge with PURE BLACK TEXT + Arrow pointing DOWN into table header -->
    <g filter="url(#badge-shadow-clean)">
      <rect x="28" y="164" width="158" height="46" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
      <text x="107" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" fill="#000000" letter-spacing="0.5">(Days)</text>
    </g>
    <!-- Arrow pointing DOWN cleanly to table header -->
    <line x1="107" y1="210" x2="107" y2="224" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" />
    <polygon points="99,220 107,232 115,220" fill="#1D4ED8" />

    <!-- 4. (Timing) Badge with PURE BLACK TEXT + Arrow pointing DOWN into table header -->
    <g filter="url(#badge-shadow-clean)">
      <rect x="226" y="164" width="176" height="46" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5" />
      <text x="314" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" fill="#000000" letter-spacing="0.5">(Timing)</text>
    </g>
    <!-- Arrow pointing DOWN cleanly to table header -->
    <line x1="314" y1="210" x2="314" y2="224" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" />
    <polygon points="306,220 314,232 322,220" fill="#1D4ED8" />

    <!-- Schedule Table -->
    <g transform="translate(28, 234)">
      <rect x="0" y="0" width="704" height="152" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6" />

      <!-- Table Header (Crimson) -->
      <rect x="0" y="0" width="704" height="46" fill="#a30818" rx="6" />
      <rect x="0" y="34" width="704" height="12" fill="#a30818" />

      <!-- Column Dividers -->
      <line x1="144" y1="0" x2="144" y2="152" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="424" y1="0" x2="424" y2="152" stroke="#CBD5E1" stroke-width="1.5" />

      <!-- Row Divider -->
      <line x1="0" y1="98" x2="704" y2="98" stroke="#CBD5E1" stroke-width="1.5" />

      <!-- Header Labels -->
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
        <text x="16" y="30">Days</text>
        <text x="160" y="30">10:00 AM - 11:30 AM</text>
        <text x="440" y="30">11:30 AM - 1:00 PM</text>
      </g>

      <!-- Row 1: Monday -->
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#000000">Monday</text>
      <text x="160" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#000000">NUT10102-MCM (Lecture)</text>

      <!-- Row 2: Wednesday -->
      <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#000000">Wednesday</text>
      <text x="440" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#000000">NUT10102-MCM (Lecture)</text>
    </g>

    <!-- BACK Button inside card -->
    <g transform="translate(320, 400)">
      <rect x="0" y="0" width="104" height="38" rx="4" fill="#a30818" />
      <text x="52" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">BACK</text>
    </g>

    <!-- ADD Button inside card -->
    <g transform="translate(628, 400)">
      <rect x="0" y="0" width="104" height="38" rx="4" fill="#a30818" />
      <text x="52" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">ADD</text>
    </g>
  </g>
</svg>
